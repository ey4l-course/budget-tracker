server:
  port: ${server.users.port}
  name: users

security:
  cluster-key: "super-secret-internal-only-cluster-key-for-users"

spring:
  config:
    import: "classpath:/${APP_ENV:dev}.yaml"
  datasource:
    url: jdbc:h2:mem:usersdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    com.budget.users: DEBUG