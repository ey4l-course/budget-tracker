server:
  port: ${server.auth.port}
  name: AUTH

spring:
  config:
    import: "classpath:/${APP_ENV:dev}.yaml"

security:
  private-key-path: "${user.home}/keys/private_key_pkcs8.pem"
  public-key-path: "${user.home}/keys/public_key.pem"
  cluster-keys:
    gw: "super-secret-internal-only-cluster-key-for-gw"
    users: "super-secret-internal-only-cluster-key-for-users"
    txn: "super-secret-internal-only-cluster-key-for-txn"
    admin: "super-secret-internal-only-cluster-key-for-admin"

jwt:
  access:
    expiry: 300000 #5 minutes
  refresh:
    expiry: 3600000 #1 hour

internal:
  auth: false
  token: false